[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a real MongoDB 6.0+ server",
  "scale: generates 100,000 attendance records; enable with --run-scale",
]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
